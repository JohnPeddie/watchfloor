# Watchfloor on the Linux home server (192.168.8.69).
#
# Collection and the daily brief run inside the app (Settings cog). Do not
# enable the legacy-cron profile unless you have turned that scheduler off.
#
#   cp deploy/env.production .env
#   docker compose up -d --build
#
# Full walkthrough: docs/DEPLOYMENT.md

name: watchfloor

services:
  # Applies the Prisma schema to the SQLite volume, then exits. Runs before the
  # app so a fresh volume or a schema change is handled without a manual step.
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: file:/app/data/watchfloor.db
    volumes:
      - watchfloor-data:/app/data
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    restart: "no"

  app:
    build:
      context: .
      target: runner
    # Bind on all interfaces so phones, the Fold, and PCs on the LAN can connect.
    # Change to "127.0.0.1:3050:3050" to expose only to the server itself.
    ports:
      - "${WATCHFLOOR_BIND:-0.0.0.0}:${WATCHFLOOR_PORT:-3050}:3050"
    environment:
      DATABASE_URL: file:/app/data/watchfloor.db
      # Daily brief items only. Articles stay on the rules engine. If the
      # workstation at 192.168.8.60 is off, the app keeps serving and briefs
      # fall back to extractive rules.
      SUMMARIZER: ${SUMMARIZER:-lmstudio}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://192.168.8.60:1234/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-300000}
      TZ: ${TZ:-Europe/London}
    volumes:
      - watchfloor-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional HTTP poller from before the in-app scheduler existed.
  # Leave this off: `docker compose --profile legacy-cron up -d` would double-run.
  scheduler:
    profiles: ["legacy-cron"]
    image: curlimages/curl:8.11.1
    depends_on:
      app:
        condition: service_healthy
    environment:
      CYCLE_SECONDS: ${CYCLE_SECONDS:-3600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "scheduler: cycle every $${CYCLE_SECONDS}s"
        while true; do
          echo "[$$(date -u +%FT%TZ)] collecting"
          curl -fsS -m 600 -X POST http://app:3050/api/ingest \
            -H 'Content-Type: application/json' \
            -d '{"fetchImages":true,"maxPerFeed":12}' || echo "ingest failed"
          curl -fsS -m 600 -X POST http://app:3050/api/brief \
            -H 'Content-Type: application/json' -d '{}' || echo "brief failed"
          sleep "$${CYCLE_SECONDS}"
        done
    restart: unless-stopped

volumes:
  watchfloor-data:
