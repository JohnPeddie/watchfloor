# Watchfloor on the machine you deploy to.
#
# Copy deploy/site.env.example to .env, fill in hosts, then:
#   docker compose up -d --build
#
# Collection and the daily brief run inside the app (Settings, in the app bar).
# Do not enable the legacy-cron profile unless you have turned that scheduler off.
#
# Full walkthrough: docs/DEPLOYMENT.md

name: watchfloor

services:
  # Applies the Prisma schema to the SQLite volume, then exits. Runs before the
  # app so a fresh volume or a schema change is handled without a manual step.
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: file:/app/data/watchfloor.db
    volumes:
      - watchfloor-data:/app/data
    # Runs as root so it can create the SQLite file, then hands the volume to
    # uid 1001 (the app user). Without this, migrate leaves the db root-owned
    # and the app gets "attempt to write a readonly database".
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /app/data
        npx prisma db push --skip-generate
        chown -R 1001:1001 /app/data
    restart: "no"

  app:
    build:
      context: .
      target: runner
    # Bind on all interfaces so other devices on the LAN can connect.
    # Set WATCHFLOOR_BIND=127.0.0.1 in .env to keep it on this machine only.
    ports:
      - "${WATCHFLOOR_BIND:-0.0.0.0}:${WATCHFLOOR_PORT:-3050}:3050"
    environment:
      DATABASE_URL: file:/app/data/watchfloor.db
      # Daily brief items and on-demand "why it matters". Articles stay on the
      # rules engine. If the model host is unreachable, the app keeps serving
      # and briefs fall back to extractive rules.
      SUMMARIZER: ${SUMMARIZER:-lmstudio}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      WATCHFLOOR_HOST_IPS: ${WATCHFLOOR_HOST_IPS:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-300000}
      TZ: ${TZ:-UTC}
    volumes:
      - watchfloor-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3050/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Optional HTTP poller from before the in-app scheduler existed.
  # Leave this off: `docker compose --profile legacy-cron up -d` would double-run.
  scheduler:
    profiles: ["legacy-cron"]
    image: curlimages/curl:8.11.1
    depends_on:
      app:
        condition: service_healthy
    environment:
      CYCLE_SECONDS: ${CYCLE_SECONDS:-3600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "scheduler: cycle every $${CYCLE_SECONDS}s"
        while true; do
          echo "[$$(date -u +%FT%TZ)] collecting"
          curl -fsS -m 600 -X POST http://app:3050/api/ingest \
            -H 'Content-Type: application/json' \
            -d '{"fetchImages":true,"maxPerFeed":12}' || echo "ingest failed"
          curl -fsS -m 600 -X POST http://app:3050/api/brief \
            -H 'Content-Type: application/json' -d '{}' || echo "brief failed"
          sleep "$${CYCLE_SECONDS}"
        done
    restart: unless-stopped

volumes:
  watchfloor-data:
